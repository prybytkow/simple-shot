<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Screen Capture</title>
    <link rel="stylesheet" href="capture/capture-window.css">
</head>
<body>
    <div id="screen-info"><span data-i18n="capture_screenInfo">Screen</span> <span id="screen-number">1</span> <span data-i18n="capture_screenOf">of</span> <span id="total-screens">1</span></div>
    <div id="info" data-i18n="capture_info">Select screen: click and drag to define capture area</div>
    <div id="esc-hint" data-i18n="capture_escHint">Press ESC to cancel</div>
    <div id="display-picker-badge">
        <div class="num" id="display-picker-num">1</div>
        <div class="label" data-i18n="capture_pickDisplay">Click to capture this display</div>
    </div>
    <div id="overlay">
        <div id="selection-area">
            <canvas id="annotation-canvas"></canvas>
            <div class="resize-handle resize-n"></div>
            <div class="resize-handle resize-s"></div>
            <div class="resize-handle resize-e"></div>
            <div class="resize-handle resize-w"></div>
            <div class="resize-handle resize-ne"></div>
            <div class="resize-handle resize-nw"></div>
            <div class="resize-handle resize-se"></div>
            <div class="resize-handle resize-sw"></div>
        </div>
        <div id="toolbar"></div>
        <div id="upload-status" aria-live="polite">
            <div class="upload-status-card">
                <div class="upload-spinner" id="upload-spinner"></div>
                <div class="upload-icon" id="upload-icon"></div>
                <div class="upload-status-title" id="upload-status-title"></div>
                <div class="upload-status-url" id="upload-status-url" title=""></div>
                <div class="upload-status-hint" id="upload-status-hint"></div>
                <div class="upload-status-error" id="upload-status-error"></div>
                <div class="upload-status-actions" id="upload-status-actions">
                    <button type="button" id="upload-copy-btn" data-i18n="history_copy">Copy</button>
                    <button type="button" class="secondary" id="upload-close-btn" data-i18n="capture_closeBtn">Close</button>
                </div>
            </div>
        </div>
        <div id="crop-popup">
            <div id="crop-panel">
                <h3 data-i18n="capture_aspectRatio">Aspect ratio</h3>
                <button type="button" class="crop-option" data-ratio="3,2">3:2</button>
                <button type="button" class="crop-option" data-ratio="2,3">2:3</button>
                <button type="button" class="crop-option" data-ratio="4,3">4:3</button>
                <button type="button" class="crop-option" data-ratio="3,4">3:4</button>
                <button type="button" class="crop-option" data-ratio="1,1">1:1</button>
                <button type="button" class="crop-option" data-ratio="16,9">16:9</button>
                <button type="button" class="crop-option crop-option-free" data-ratio="0,0" data-i18n="capture_cropFree">Free</button>
            </div>
        </div>
        <div id="format-popup">
            <div id="format-panel">
                <h3 data-i18n="capture_formatTitle">Text and highlight format</h3>
                <div class="format-row">
                    <label data-i18n="capture_textColor">Text color</label>
                    <div class="format-color-row">
                        <div class="format-presets" id="format-text-presets" data-role="text"></div>
                        <input type="color" id="format-text-color" value="#000000" data-i18n-title="capture_textColor">
                    </div>
                </div>
                <div class="format-row">
                    <label data-i18n="capture_highlightColor">Highlight color</label>
                    <div class="format-color-row">
                        <div class="format-presets" id="format-highlight-presets" data-role="highlight"></div>
                        <input type="color" id="format-highlight-color" value="#ffff00" data-i18n-title="capture_highlightColor">
                    </div>
                </div>
                <div class="format-row">
                    <label data-i18n="capture_fontSize">Font size</label>
                    <input type="number" id="format-font-size" min="8" max="120" value="16" data-i18n-title="capture_fontSize">
                </div>
                <div class="format-row">
                    <label data-i18n="capture_fontBgSize">Font background padding</label>
                    <input type="number" id="format-font-bg-size" min="0" max="50" value="4" data-i18n-title="capture_fontBgSize">
                </div>
                <div class="format-row">
                    <label data-i18n="capture_highlightSize">Highlight size</label>
                    <input type="number" id="format-highlight-size" min="1" max="30" value="4" data-i18n-title="capture_highlightSize">
                </div>
                <button type="button" class="btn-close" id="format-close-btn" data-i18n="capture_close">Close</button>
            </div>
        </div>
        <div id="text-input-popup">
            <div id="text-input-panel">
                <h3 data-i18n="capture_enterText">Enter text</h3>
                <input type="text" id="text-input-field" data-i18n-placeholder="capture_annotationPlaceholder" maxlength="500" />
                <div class="text-input-buttons">
                    <button type="button" class="btn-cancel" id="text-input-cancel" data-i18n="capture_cancel">Cancel</button>
                    <button type="button" class="btn-ok" id="text-input-ok" data-i18n="capture_ok">OK</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="capture/context.js"></script>
    <script src="capture/i18n.js"></script>
    <script src="capture/image.js"></script>
    <script src="capture/overlay-init.js"></script>
    <script src="capture/format-colors.js"></script>
    <script src="capture/annotation.js"></script>
    <script src="capture/selection.js"></script>
    <script src="capture/toolbar.js"></script>
    <script src="capture/actions.js"></script>
    <script src="capture/keyboard.js"></script>
    <script src="capture/overlay-size.js"></script>

</body>
</html>
